name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader
      
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.guinesoftware.com.br
          username: guinesoftware
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /www/sistema/
          exclude: |
            **/.git*
            **/.github*
            **/tests*
            **/.env*
            **/.vscode*
            **/.idea*
            **/node_modules*
            **/.DS_Store*
            **/README.md
            **/phpunit.xml.dist
