name: Deploy FTPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: mobilelocacoes.com
          username: mobilelocacoes
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /www/sistema/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github*
            **/.cursor*
            **/.cursor/**
            **/.env*
            **/vendor*
            **/node_modules*
            **/.vscode*
            **/.idea*
            **/tests*
            **/.DS_Store*
            **/README.md
            **/phpunit.xml.dist
            **/INSTALACAO_IIS.md
            **/SOLUCAO_403_14.md
