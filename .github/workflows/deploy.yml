name: Deploy via FTP

on:
  push:
    branches:
      - main   # troque se sua branch principal for master

jobs:
  ftp-deploy:
    name: Upload to FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Deploy para FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: web21f90.uni5.net
          username: mobilelocacoes
          password: Senha100Teste1
          protocol: sftp      # ou ftps se seu servidor suportar
          port: 22
          local-dir: ./
          server-dir: /www/painel/
