name: Deploy via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Remove .cursor directory
        run: |
          if [ -d "./sistema/.cursor" ]; then
            rm -rf ./sistema/.cursor
          fi
      
      - name: Upload files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: mobilelocacoes
          server: ftp.web21f90.uni5.net
          port: 22
          password: ${{ secrets.FTP_PASSWORD_MOBILE }}
          local_path: "./sistema/*"
          remote_path: "/painel"
          sftp_only: true
  