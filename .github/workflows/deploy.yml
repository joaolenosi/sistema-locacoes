name: Deploy FTPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Remover pastas desnecessárias antes do deploy
        run: |
          rm -rf .git .github .cursor vendor node_modules tests
          rm -f .env .env.* README.md phpunit.xml.dist INSTALACAO_IIS.md SOLUCAO_403_14.md
          find . -name ".DS_Store" -delete 2>/dev/null || true
          find . -name "Thumbs.db" -delete 2>/dev/null || true

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: mobilelocacoes.com
          username: mobilelocacoes
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps   
          port: 21
          local-dir: ./
          server-dir: /home/mobilelocacoes/www/sistema/

          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
          exclude: |
            .git/
            .github/
            .cursor/
            .env
            .env.*
            vendor/
            node_modules/
            .vscode/
            .idea/
            tests/
            .DS_Store
            README.md
            phpunit.xml.dist
            INSTALACAO_IIS.md
            SOLUCAO_403_14.md