name: PHP Deploy

on:
  push:
    branches: [ "main" ] 

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-dev

      # 🚀 Deploy FTP
      - name: Deploy para FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: web21f90.uni5.net
          username: mobilelocacoes
          password: ${{ secrets.FTP_PASSWORD_MOBILE }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /www/painel/
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.github*
            .cursor/
            **/.cursor/**
            **/.cursor*
            **/tests*
            **/.env*
            **/.vscode*
            **/.idea*
            **/node_modules*
            **/.DS_Store*
            **/README.md
            **/phpunit.xml.dist
            **/vendor*
