name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.guinesoftware.com.br
          username: guinesoftware
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./sistema/
          server-dir: /www/sistema/
          exclude: |
            **/.git*
            **/.github*
            **/.cursor*
            **/tests*
            **/.env*
            **/.vscode*
            **/.idea*
            **/node_modules*
            **/.DS_Store*
            **/README.md
            **/phpunit.xml.dist
            **/vendor*
      
      - name: Install Composer dependencies via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ftp.web15f10.uni5.net
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /www/sistema
            composer install --no-dev --optimize-autoloader
