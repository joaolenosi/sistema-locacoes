name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Remove .cursor directory
        run: |
          if [ -d "./sistema/.cursor" ]; then
            rm -rf ./sistema/.cursor
          fi
      
      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.guinesoftware.com.br
          username: guinesoftware
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./sistema/
          server-dir: /home/guinesoftware/www/sistema/
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
          exclude: |
            **/.git*
            **/.github*
            .cursor/
            **/.cursor/**
            **/.cursor*
            **/tests*
            **/.env*
            **/.vscode*
            **/.idea*
            **/node_modules*
            **/.DS_Store*
            **/README.md
            **/phpunit.xml.dist
            **/vendor*
